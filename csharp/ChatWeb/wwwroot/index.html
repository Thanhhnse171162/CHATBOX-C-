<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chatting Group - Ứng dụng chat nhóm real-time với SignalR">
    <title>Chatting Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- ═══════ LOGIN SCREEN ═══════ -->
    <div id="login-screen" class="screen active">
        <div class="login-bg">
            <div class="floating-orb orb-1"></div>
            <div class="floating-orb orb-2"></div>
            <div class="floating-orb orb-3"></div>
        </div>
        <div class="login-card" id="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 48 48" fill="none">
                        <rect x="4" y="8" width="40" height="28" rx="6" fill="url(#logoGrad)"/>
                        <path d="M16 36L12 42" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="16" cy="22" r="2.5" fill="white"/>
                        <circle cx="24" cy="22" r="2.5" fill="white"/>
                        <circle cx="32" cy="22" r="2.5" fill="white"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="4" y1="8" x2="44" y2="36">
                                <stop stop-color="#0084ff"/>
                                <stop offset="1" stop-color="#00a2ff"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Chatting Group</h1>
                <p class="login-subtitle">Kết nối mọi lúc, mọi nơi</p>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="login-server-host">IP/Host Server</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                            <line x1="6" y1="6" x2="6.01" y2="6"/>
                            <line x1="6" y1="18" x2="6.01" y2="18"/>
                        </svg>
                        <input type="text" id="login-server-host" placeholder="localhost:5000 hoặc IP radmin vpn" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-username">Tên đăng nhập</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="login-username" placeholder="Nhập username..." required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <div class="input-group" id="display-name-group" style="display:none;">
                    <label for="login-displayname">Tên hiển thị</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                        <input type="text" id="login-displayname" placeholder="Tên hiển thị...">
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btn-login">
                    <span>Đăng nhập</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>

            <div class="login-toggle">
                <span id="toggle-text">Chưa có tài khoản?</span>
                <button type="button" id="btn-toggle-register" class="btn-link">Đăng ký</button>
            </div>

            <div id="login-error" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <!-- ═══════ CHAT SCREEN ═══════ -->
    <div id="chat-screen" class="screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile" id="user-profile">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-info">
                        <span class="user-name" id="user-display-name">User</span>
                        <span class="user-status">
                            <span class="status-dot online"></span> Online
                        </span>
                    </div>
                </div>
                <button class="icon-btn" id="btn-logout" title="Đăng xuất">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-search">
                <div class="input-wrapper small">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="search-rooms" placeholder="Tìm phòng chat...">
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Phòng chat</h3>
                    <button class="icon-btn small" id="btn-create-room" title="Tạo phòng mới">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div id="room-list" class="room-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Người dùng</h3>
                    <span class="badge" id="online-count">0</span>
                </div>
                <div id="user-list" class="user-list"></div>
            </div>
        </aside>

        <!-- Chat Main -->
        <main id="chat-main" class="chat-main">
            <!-- Empty State -->
            <div id="empty-state" class="empty-state">
                <div class="empty-illustration">
                    <svg viewBox="0 0 200 200" fill="none">
                        <circle cx="100" cy="100" r="80" fill="url(#emptyGrad)" opacity="0.1"/>
                        <rect x="50" y="60" width="100" height="70" rx="12" fill="url(#emptyGrad)" opacity="0.3"/>
                        <circle cx="75" cy="95" r="5" fill="white"/>
                        <circle cx="100" cy="95" r="5" fill="white"/>
                        <circle cx="125" cy="95" r="5" fill="white"/>
                        <path d="M70 130L60 145" stroke="url(#emptyGrad)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
                        <defs>
                            <linearGradient id="emptyGrad" x1="20" y1="20" x2="180" y2="180">
                                <stop stop-color="#0084ff"/>
                                <stop offset="1" stop-color="#00a2ff"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2>Chào mừng đến Chatting Group!</h2>
                <p>Chọn một phòng chat để bắt đầu trò chuyện</p>
            </div>

            <!-- Chat Header -->
            <div id="chat-header" class="chat-header" style="display:none;">
                <button class="icon-btn mobile-only" id="btn-back-sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <div class="chat-room-info">
                    <div class="room-avatar" id="room-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div>
                        <h3 id="chat-room-name">Room Name</h3>
                        <span class="typing-indicator" id="typing-indicator" style="display:none;">
                            <span class="typing-dots">
                                <span></span><span></span><span></span>
                            </span>
                            <span id="typing-text">đang nhập...</span>
                        </span>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" id="btn-voice-call" title="Gọi thoại">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btn-video-call" title="Gọi video">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div id="chat-messages" class="chat-messages" style="display:none;">
                <div id="messages-container"></div>
            </div>

            <!-- Input -->
            <div id="chat-input-area" class="chat-input-area" style="display:none;">
                <div class="input-toolbar">
                    <label class="icon-btn" id="btn-attach" title="Đính kèm file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        <input type="file" id="file-input" style="display:none;">
                    </label>
                    <label class="icon-btn" id="btn-image" title="Gửi ảnh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <input type="file" id="image-input" accept="image/*" style="display:none;">
                    </label>
                </div>
                <div class="message-compose">
                    <div id="file-preview" class="file-preview" style="display:none;">
                        <div class="file-preview-content">
                            <img id="preview-image" src="" alt="" style="display:none;">
                            <span id="preview-filename"></span>
                        </div>
                        <button class="icon-btn small" id="btn-cancel-file" title="Hủy">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <textarea id="message-input" placeholder="Nhập tin nhắn..." rows="1"></textarea>
                    <button class="btn-send" id="btn-send" title="Gửi">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══════ Create Room Modal ═══════ -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal" id="create-room-modal">
            <div class="modal-header">
                <h3>Tạo phòng chat mới</h3>
                <button class="icon-btn" id="btn-close-modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="new-room-name">Tên phòng</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <input type="text" id="new-room-name" placeholder="Nhập tên phòng...">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-create">Hủy</button>
                <button class="btn-primary" id="btn-confirm-create">
                    <span>Tạo phòng</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════ Toast Container ═══════ -->
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
